<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Horizon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
        }

        #scene {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
        }

        .overlay {
            position: fixed;
            left: 24px;
            bottom: 24px;
            pointer-events: none;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.9);
        }

        .overlay h1 {
            font-size: 1.1em;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #ffd6a8;
        }

        .overlay p {
            margin-top: 6px;
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.55);
        }

        .overlay a {
            pointer-events: auto;
            color: #ff69b4;
        }

        .error {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            text-align: center;
            color: #ffb3d9;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <canvas id="scene"></canvas>

    <div class="overlay">
        <h1>Event Horizon</h1>
        <p>Move the mouse to orbit &middot; scroll to zoom &middot; <a href="quiz.html">Play the Seismic Quiz</a></p>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
